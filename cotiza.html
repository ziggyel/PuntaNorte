<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Cotizá tu proyecto | Punta Norte</title>

<meta name="description" content="Agendemos una reunión con Punta Norte. Completa el formulario para avanzar ágilmente." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0B1622;
--bg-dark:#050B12;
--primary:#C9CCD1;
--text:#FFFFFF;
--muted:#E5E7EA;
--ink:#0B1622;
--border:rgba(201,204,209,.25);
--radius:18px;
--max:900px;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Montserrat',sans-serif;
color:var(--text);
background:
radial-gradient(900px 520px at 12% 12%, rgba(201,204,209,.10), transparent 60%),
radial-gradient(700px 520px at 88% 18%, rgba(47,69,93,.35), transparent 58%),
linear-gradient(180deg,var(--bg-dark),var(--bg));
line-height:1.6;
}

.container{
max-width:var(--max);
margin:auto;
padding:0 20px;
}

/* HEADER */

header{
position:sticky;
top:0;
background:rgba(5,11,18,.82);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
z-index:50;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:14px 0;
}

/* LOGO */

.logo img{
height:45px;
width:auto;
display:block;
}

/* BOTONES */

.header-buttons{
display:flex;
gap:10px;
}

.btn{
padding:10px 18px;
border-radius:999px;
font-weight:800;
font-size:14px;
border:1px solid var(--border);
display:inline-flex;
align-items:center;
justify-content:center;
text-decoration:none;
white-space:nowrap;
font-family:'Montserrat',sans-serif;
cursor:pointer;
transition:.2s ease;
}

.btn-primary{
background:var(--primary);
color:var(--ink);
}

.btn-secondary{
background:transparent;
color:#fff;
}

.btn:hover{
transform:translateY(-1px);
opacity:.95;
}

/* MAIN */

.main{
padding:55px 0 80px;
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
color:var(--muted);
margin-bottom:15px;
}

/* PANEL */

.panel{
background:rgba(255,255,255,.04);
border:1px solid var(--border);
border-radius:20px;
padding:24px;
margin-top:25px;
}

/* FORM */

.form{
display:grid;
gap:15px;
margin-top:20px;
}

label{
font-size:13px;
font-weight:700;
color:var(--muted);
margin-bottom:5px;
display:block;
}

input,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
background:#0F1F2E;
color:#fff;
font-family:'Montserrat',sans-serif;
outline:none;
}

textarea{
min-height:120px;
resize:none;
}

input:focus,
textarea:focus{
border-color:rgba(201,204,209,.55);
box-shadow:0 0 0 4px rgba(201,204,209,.10);
}

/* MOBILE */

@media(max-width:900px){

.nav{
flex-wrap:wrap;
justify-content:center;
}

.header-buttons{
width:100%;
justify-content:center;
flex-wrap:wrap;
}

h1{
font-size:34px;
text-align:center;
}

.main{
padding:40px 0 70px;
}

p{
text-align:center;
}

}

</style>
</head>

<body>

<header>

<div class="container nav">

<div class="logo">
<a href="index.html#inicio">
<img src="https://ziggyel.github.io/PuntaNorte/logo.jpeg" alt="Punta Norte" style="height:45px;width:auto;display:block;">
</a>
</div>

<div class="header-buttons">

<a class="btn btn-secondary" href="index.html#servicios">
Ver servicios
</a>

<a class="btn btn-primary" href="index.html#contacto">
Contacto
</a>

</div>

</div>

</header>

<main class="main">

<div class="container">

<h1>¡Agendemos una reunión!</h1>

<p>
Solo unas pocas preguntas rápidas para avanzar ágilmente y conectarte:
</p>

<div class="panel">

<form class="form" action="mailto:puntanorte@gmail.com" method="post" enctype="text/plain">

<div>
<label for="nombre">Nombre</label>
<input id="nombre" name="Nombre" type="text" required placeholder="Tu nombre">
</div>

<div>
<label for="email">Email</label>
<input id="email" name="Email" type="email" required placeholder="tuemail@empresa.com">
</div>

<div>
<label for="empresa">Nombre de la empresa</label>
<input id="empresa" name="Empresa" type="text" placeholder="Empresa">
</div>

<div>
<label for="telefono">Número de contacto</label>
<input id="telefono" name="Teléfono" type="tel" placeholder="+54 9 ...">
</div>

<div>
<label for="comentarios">Comentarios</label>
<textarea id="comentarios" name="Comentarios" placeholder="Contanos brevemente qué necesitás"></textarea>
</div>

<button class="btn btn-primary" type="submit">
Enviar
</button>

</form>

</div>

</div>

</main>

</body>
</html>
