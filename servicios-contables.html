<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Servicios contables | Punta Norte</title>
<meta name="description" content="Servicios Contables - Punta Norte Consultoría Integral" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1622;--bg-dark:#050B12;--panel:#1A2C3F;--primary:#C9CCD1;--accent:#79A7D8;--text:#FFFFFF;--muted:#E5E7EA;--border:rgba(201,204,209,.25);--radius:18px;--max:1150px}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:'Montserrat',sans-serif;background:linear-gradient(180deg,var(--bg-dark),var(--bg));color:var(--text);line-height:1.6} h1,h2,h3{font-family:'Montserrat',serif;letter-spacing:-.3px;margin-top:0}.container{max-width:var(--max);margin:auto;padding:0 20px}
header{position:sticky;top:0;background:rgba(5,11,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:100}.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-weight:800;font-size:18px}nav ul{display:flex;list-style:none;gap:25px;padding:0;margin:0}nav a{text-decoration:none;color:var(--muted);font-weight:600}nav a:hover{color:#fff}.nav-buttons{display:flex;gap:10px}.btn{padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px;border:1px solid var(--border);text-decoration:none;display:inline-block;cursor:pointer}.btn-primary{background:var(--primary);color:#0B1622}.btn-secondary{background:transparent;color:#fff}
.service-hero{padding:70px 0 35px}.service-hero a{margin-bottom:25px}.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}.service-grid img{width:100%;min-height:390px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)}.box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px}.box h1{
font-size:24px;
line-height:1.2;
margin-bottom:16px;
}.highlight{font-size:20px;color:var(--muted)}.contact-box{margin-top:28px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--radius);padding:24px}.contact-box h2{font-size:28px}.contact-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.contact-info{color:var(--muted);line-height:2}footer{padding:30px 0;border-top:1px solid var(--border);text-align:center;font-size:14px;color:var(--muted);margin-top:60px}
@media(max-width:900px){nav ul{display:none}.service-grid{grid-template-columns:1fr}.service-grid img{min-height:260px}.nav{gap:10px}.nav-buttons{flex-wrap:wrap;justify-content:flex-end}}

.logo img{
  height:45px !important;
  width:auto !important;
  max-width:180px !important;
  display:block;
}
  .service-form{
display:grid;
gap:14px;
margin-top:18px;
}

.service-form input,
.service-form textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--border);
background:#0F1F2E;
color:#fff;
font-family:'Montserrat',sans-serif;
outline:none;
}

.service-form textarea{
min-height:120px;
resize:none;
}

.service-form button{
width:100%;
margin-top:6px;
}
</style>
</head>
<body>
<header>
  <div class="container nav">

    <div class="logo">
      <a href="index.html">
        <img src="logo.jpeg" alt="Punta Norte">
      </a>
    </div>

    <nav>
      <ul>
        <li><a href="index.html#inicio">Inicio</a></li>
        <li><a href="index.html#servicios">Áreas de Servicio</a></li>
        <li><a href="index.html#quienes">Quiénes Somos</a></li>
        <li><a href="index.html#contacto">Contacto</a></li>
      </ul>
    </nav>

    <div class="nav-buttons">
      <a href="#contacto-servicio" class="btn btn-primary">Cotizá tu proyecto</a>
      <a href="index.html#contacto" class="btn btn-secondary">Contacto</a>
    </div>

  </div>
</header>
<main class="container service-hero">
<a href="index.html#servicios" class="btn btn-secondary">← Volver a servicios</a>
<div class="service-grid">
<img src="serviciocontable.jpeg">
<div class="contact-box" id="contacto-servicio">

<h2>Cotizá tu proyecto</h2>

<p>Solo unas pocas preguntas rápidas para avanzar ágilmente y conectarte.</p>

<form class="service-form" action="mailto:puntanorte@gmail.com" method="post" enctype="text/plain">

<input type="text" name="Nombre" required placeholder="Tu nombre">

<input type="email" name="Email" required placeholder="tuemail@empresa.com">

<input type="text" name="Empresa" placeholder="Empresa">

<input type="tel" name="Teléfono" placeholder="+54 9 ...">

<textarea name="Comentarios" placeholder="Contanos brevemente qué necesitás"></textarea>

<button class="btn btn-primary" type="submit">Enviar</button>

</form>

</div>
</div>
</div>
</div>
</main>
<footer>© Punta Norte - Consultora Empresarial <br>Powered by Punta Norte</footer>
</body>
</html>
